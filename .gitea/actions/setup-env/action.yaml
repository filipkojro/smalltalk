name: 'Setup Environment'
description: 'Sets up Rust toolchain and caches APT dependencies'

runs:
  using: "composite"
  steps:
    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Cache and install APT packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0
        version: 1.0
